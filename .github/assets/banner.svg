<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="React Interview Handbook: 304 React interview questions answered across 29 sections">
  <defs>
    <radialGradient id="bg" cx="22%" cy="45%" r="85%">
      <stop offset="0" stop-color="#1d2a4a"/>
      <stop offset="0.55" stop-color="#121522"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#61dafb"/>
    </linearGradient>
    <linearGradient id="path" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="1110" y2="0">
      <stop offset="0" stop-color="#61dafb"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="22" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="21.5" fill="none" stroke="#262935"/>

  <!-- React atom -->
  <g transform="translate(220 200)" filter="url(#glow)" fill="none" stroke="#61dafb" stroke-width="7">
    <circle r="16" fill="#61dafb" stroke="none"/>
    <ellipse rx="112" ry="42"/>
    <ellipse rx="112" ry="42" transform="rotate(60)"/>
    <ellipse rx="112" ry="42" transform="rotate(120)"/>
  </g>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <!-- Badge -->
    <rect x="410" y="62" width="356" height="32" rx="16" fill="#14161d" stroke="#2f3342"/>
    <text x="588" y="83" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="15" fill="#9a9fb2">29 sections · 304 questions · 2 parts</text>

    <!-- Title -->
    <text x="408" y="160" font-size="66" font-weight="800" fill="#e7e8ee" letter-spacing="-1.5">React Interview <tspan fill="url(#title)">Handbook</tspan></text>
    <text x="410" y="202" font-size="23" fill="#9a9fb2">From fundamentals to Fiber internals, performance and real production scenarios.</text>

    <!-- Chips -->
    <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="15" fill="#e7e8ee">
      <rect x="410" y="230" width="62" height="30" rx="7" fill="#14161d" stroke="#2f3342"/><text x="441" y="250" text-anchor="middle">JSX</text>
      <rect x="482" y="230" width="72" height="30" rx="7" fill="#14161d" stroke="#2f3342"/><text x="518" y="250" text-anchor="middle">Hooks</text>
      <rect x="564" y="230" width="72" height="30" rx="7" fill="#14161d" stroke="#2f3342"/><text x="600" y="250" text-anchor="middle">Fiber</text>
      <rect x="646" y="230" width="120" height="30" rx="7" fill="#14161d" stroke="#2f3342"/><text x="706" y="250" text-anchor="middle">Concurrency</text>
      <rect x="776" y="230" width="94" height="30" rx="7" fill="#14161d" stroke="#2f3342"/><text x="823" y="250" text-anchor="middle">Suspense</text>
      <rect x="880" y="230" width="72" height="30" rx="7" fill="#14161d" stroke="#2f3342"/><text x="916" y="250" text-anchor="middle">Redux</text>
      <rect x="962" y="230" width="94" height="30" rx="7" fill="#14161d" stroke="#2f3342"/><text x="1009" y="250" text-anchor="middle">Security</text>
      <rect x="1066" y="230" width="62" height="30" rx="7" fill="#14161d" stroke="#2f3342"/><text x="1097" y="250" text-anchor="middle">Perf</text>
    </g>

    <!-- Learning path -->
    <line x1="420" y1="316" x2="1110" y2="316" stroke="url(#path)" stroke-width="3" opacity="0.8"/>
    <g fill="#0b0d13" stroke="#a78bfa" stroke-width="3">
      <circle cx="420" cy="316" r="9"/><circle cx="558" cy="316" r="9"/><circle cx="696" cy="316" r="9"/>
      <circle cx="834" cy="316" r="9"/><circle cx="972" cy="316" r="9"/><circle cx="1110" cy="316" r="9" fill="#a78bfa"/>
    </g>
    <g font-size="15" fill="#9a9fb2" text-anchor="middle">
      <text x="420" y="348">Basics</text><text x="558" y="348">Hooks</text><text x="696" y="348">Internals</text>
      <text x="834" y="348">Perf</text><text x="972" y="348">Security</text><text x="1110" y="348" fill="#e7e8ee">Scenarios</text>
    </g>
  </g>
</svg>
